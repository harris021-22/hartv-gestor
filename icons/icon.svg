<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="6" />

  <!-- Signal Waves -->
  <path d="M 180 140 A 100 100 0 0 1 332 140" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" opacity="0.6" />
  <path d="M 216 176 A 50 50 0 0 1 296 176" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- TV Screen Frame -->
  <rect x="96" y="200" width="320" height="200" rx="28" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Screen Inner Display -->
  <rect x="112" y="216" width="288" height="168" rx="18" fill="#090d16" />

  <!-- IPTV Play & User Elements inside Screen -->
  <polygon points="210,250 210,350 310,300" fill="url(#accentGrad)" />

  <!-- Stand and Base -->
  <rect x="236" y="408" width="40" height="30" rx="6" fill="#334155" />
  <rect x="186" y="438" width="140" height="14" rx="7" fill="url(#primaryGrad)" />

  <!-- Notification Badge -->
  <circle cx="390" cy="190" r="28" fill="#ef4444" stroke="#0a0e17" stroke-width="6" />
  <circle cx="390" cy="190" r="10" fill="#ffffff" />
</svg>
